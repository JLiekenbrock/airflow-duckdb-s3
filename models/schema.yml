version: 2

models:
  - name: stg_nyc_taxi_trips
    description: Typed NYC yellow-taxi trips filtered by pickup date.
    columns:
      - name: source_month
        tests:
          - not_null
      - name: trip_id
        tests:
          - not_null
          - unique
      - name: pickup_date
        tests:
          - not_null
      - name: pickup_at
        tests:
          - not_null
      - name: source_row_number
        tests:
          - not_null
      - name: total_amount
        description: Nullable USD total. Negative amounts from source corrections are retained.
  - name: nyc_taxi_trips
    description: Incremental NYC trip fact table, partitioned monthly by NYC pickup date.
    columns:
      - name: trip_id
        description: Surrogate from source month and original row position; assumes stable file ordering.
        tests: [unique]
